version: '3.8'

services:
  socrates_cbt_service:
    container_name: socrates_cbt_service
    build:
      context: ./python-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  socrates_postgres:
    container_name: socrates_postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-socrates_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-socrates_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-socrates_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
